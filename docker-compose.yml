# Local Postgres for development (until Supabase keys are added)
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: accesslens
      POSTGRES_PASSWORD: accesslens
      POSTGRES_DB: accesslens
    ports: ["5455:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accesslens"]
      interval: 5s
      retries: 10
volumes:
  pgdata:


